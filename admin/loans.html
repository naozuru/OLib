<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loans - Library Admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
</head>
<body>
  <div class="admin">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <main class="admin-content">
        <div class="admin-toolbar">
          <div class="seg" id="seg" role="group" aria-label="Loan filter">
            <button type="button" data-f="active" aria-pressed="true">Borrowed</button>
            <button type="button" data-f="late" aria-pressed="false">Overdue</button>
            <button type="button" data-f="returned" aria-pressed="false">Returned</button>
            <button type="button" data-f="all" aria-pressed="false">All</button>
          </div>
          <div class="input-icon grow">
            <iconify-icon icon="lucide:search" width="18" height="18" aria-hidden="true"></iconify-icon>
            <input class="input" id="q" type="search" placeholder="Search by name, Student ID, class or title" aria-label="Search loans">
          </div>
          <button class="btn btn-outline" id="copyBtn" type="button" hidden>
            <iconify-icon icon="lucide:copy" width="18" height="18" aria-hidden="true"></iconify-icon>Copy list
          </button>
          <button class="btn btn-primary" id="addBtn" type="button">Record a loan</button>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="tbl" style="min-width:820px">
              <thead>
                <tr><th>Student</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th class="num">Actions</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="empty"></div>
          <div class="table-foot" id="foot">
            <span id="info"></span>
            <div class="pager">
              <button class="icon-btn" id="prev" type="button" aria-label="Previous page"><iconify-icon icon="lucide:chevron-left" width="18" height="18" aria-hidden="true"></iconify-icon></button>
              <span id="pageLabel"></span>
              <button class="icon-btn" id="next" type="button" aria-label="Next page"><iconify-icon icon="lucide:chevron-right" width="18" height="18" aria-hidden="true"></iconify-icon></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    (function () {
      if (!Admin.guard()) return;

      var $ = function (id) { return document.getElementById(id); };
      var FILTERS = ['active', 'late', 'returned', 'all'];
      var PER = 25;
      var filter = new URLSearchParams(location.search).get('filter');
      if (FILTERS.indexOf(filter) < 0) filter = 'active';
      var loans = [], page = 1, q = '', loading = true, reqId = 0;
      var settings = { durasi_pinjam_default: 7, maks_perpanjangan: 1, durasi_perpanjangan: 7, maks_buku_per_siswa: 3 };
      var refs = null;

      Admin.mountShell(filter === 'late' ? 'late' : 'loans', 'Loans');

      // Highlight the matching sidebar item for the active tab
      function syncNav() {
        Array.prototype.forEach.call(document.querySelectorAll('#sidebar .side-nav a'), function (a) {
          var href = a.getAttribute('href');
          var on = filter === 'late' ? href === 'loans.html?filter=late' : href === 'loans.html';
          if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
        });
      }

      function markSeg() {
        Array.prototype.forEach.call($('seg').querySelectorAll('button'), function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-f') === filter));
        });
        $('copyBtn').hidden = filter !== 'late';
        syncNav();
      }

      function visible() {
        var s = q.toLowerCase();
        return loans.filter(function (l) {
          return !s || [l.nama, l.nis, l.kelas, l.judul].join(' ').toLowerCase().indexOf(s) > -1;
        });
      }

      function statusCell(l) {
        if (l.status === 'Borrowed') {
          return '<div class="stack-sm">' + UI.loanBadge(l) +
            (l.fine > 0 ? '<small>Fine ' + UI.rupiah(l.fine) + '</small>' : '') + '</div>';
        }
        return '<div class="stack-sm"><span class="badge muted">Returned</span><small>' + UI.fmtDate(l.tgl_kembali) +
          (l.days_late > 0 ? ', ' + l.days_late + (l.days_late === 1 ? ' day late' : ' days late') : '') + '</small></div>';
      }

      function actionCell(l) {
        if (l.status !== 'Borrowed') return '<div class="actions"><span class="hint">-</span></div>';
        var maxed = l.extensions >= settings.maks_perpanjangan;
        return '<div class="actions">' +
          '<button class="btn btn-soft btn-sm" type="button" data-act="ret" data-id="' + UI.esc(l.id) + '">Return</button>' +
          '<button class="icon-btn" type="button" data-act="ext" data-id="' + UI.esc(l.id) + '"' + (maxed ? ' disabled' : '') +
            ' title="' + (maxed ? 'Extension limit reached' : 'Extend') + '" aria-label="Extend ' + UI.esc(l.judul) + '">' +
            UI.icon('calendar-plus', 18) + '</button></div>';
      }

      function emptyState() {
        var map = {
          active: ['book-open', 'No books are borrowed right now', 'New loans will appear here after you record them.'],
          late: ['circle-check', 'Nothing is overdue', 'All books are within their loan period.'],
          returned: ['history', 'No returns recorded yet', 'Books that have been returned will be listed here.'],
          all: ['arrow-left-right', 'No loans yet', 'Start by recording the first loan.']
        };
        var m = map[filter];
        return UI.state({ icon: m[0], title: m[1], text: m[2] });
      }

      function render() {
        var list = visible();
        var pages = Math.max(1, Math.ceil(list.length / PER));
        if (page > pages) page = pages;
        $('rows').innerHTML = list.slice((page - 1) * PER, page * PER).map(function (l) {
          return '<tr><td><div class="cell-person"><button class="link-btn" type="button" data-hist="member" data-id="' + UI.esc(l.id_anggota) + '">' +
            UI.esc(l.nama || '(deleted student)') + '</button><small>' + UI.esc([l.nis, l.kelas].filter(Boolean).join(', ')) + '</small></div></td>' +
            '<td><button class="link-btn" type="button" data-hist="book" data-id="' + UI.esc(l.id_buku) + '" style="font-weight:600">' + UI.esc(l.judul) + '</button></td>' +
            '<td class="nowrap">' + UI.fmtDate(l.tgl_pinjam) + '</td>' +
            '<td class="nowrap">' + UI.fmtDate(l.tgl_jatuh_tempo) + '</td>' +
            '<td>' + statusCell(l) + '</td><td>' + actionCell(l) + '</td></tr>';
        }).join('');

        if (loading) {
          $('empty').innerHTML = '<div class="skeleton" style="height:56px;margin:12px"></div><div class="skeleton" style="height:56px;margin:12px"></div>';
        } else if (!list.length) {
          $('empty').innerHTML = loans.length
            ? UI.state({ icon: 'search-x', title: 'Nothing found', text: 'Try a different keyword.' })
            : emptyState();
        } else {
          $('empty').innerHTML = '';
        }
        $('info').textContent = list.length ? list.length + (list.length === 1 ? ' record' : ' records') : '';
        $('pageLabel').textContent = 'Page ' + page + ' of ' + pages;
        $('prev').disabled = page <= 1;
        $('next').disabled = page >= pages;
        $('foot').hidden = !list.length;
      }

      async function load() {
        var id = ++reqId;
        loading = true; loans = []; render();
        try {
          var data = await API.post('listLoans', { filter: filter });
          if (id !== reqId) return;
          loans = data; loading = false; render();
        } catch (e) {
          if (id !== reqId) return;
          loading = false;
          $('rows').innerHTML = ''; $('foot').hidden = true;
          $('empty').innerHTML = UI.state({
            icon: 'wifi-off', title: 'The loans could not be loaded', text: e.message,
            action: '<button class="btn btn-soft" id="retry" type="button">Try again</button>'
          });
          $('retry').onclick = load;
        }
      }

      // ----- Record a loan -----
      async function loadAvailableBooks() {
        var all = [], p = 1, total = Infinity;
        while (all.length < total) {
          var d = await API.get('listBooks', { tersedia: true, page: p, pageSize: 100 });
          total = d.total; all = all.concat(d.items); p++;
          if (!d.items.length) break;
        }
        return all;
      }

      async function ensureRefs() {
        if (refs) return refs;
        var res = await Promise.all([API.post('listMembers', {}), loadAvailableBooks()]);
        refs = { members: res[0], books: res[1] };
        return refs;
      }

      function uniqueLabels(items, labelFn) {
        var map = {}, html = '';
        items.forEach(function (it) {
          var label = labelFn(it);
          if (map[label]) label += ' #' + String(it.id).slice(-4);
          map[label] = it.id;
          html += '<option value="' + UI.esc(label) + '">';
        });
        return { map: map, html: html };
      }

      async function openLoanForm() {
        var btn = $('addBtn');
        btn.disabled = true; btn.textContent = 'Loading data...';
        var r;
        try { r = await ensureRefs(); }
        catch (e) { UI.toast(e.message, 'error'); return; }
        finally { btn.disabled = false; btn.textContent = 'Record a loan'; }

        if (!r.members.length) { UI.toast('There are no active students yet. Add students first.', 'error'); return; }
        if (!r.books.length) { UI.toast('Every book is on loan or held, or there are no books yet.', 'error'); return; }

        var mem = uniqueLabels(r.members, function (m) { return m.nis + ' - ' + m.nama + (m.kelas ? ' (' + m.kelas + ')' : ''); });
        var bk = uniqueLabels(r.books, function (b) { return b.judul + (b.penulis ? ' - ' + b.penulis : '') + ' (' + b.stok_tersedia + ' free)'; });

        var ok = await Admin.modal({
          title: 'Record a loan', submit: 'Save loan',
          html: '<div class="form-grid">' +
            '<div class="field full"><label for="l_member">Student *</label>' +
              '<input class="input" id="l_member" name="member" list="memList" placeholder="Type a Student ID or name, then pick from the list" autocomplete="off" required>' +
              '<datalist id="memList">' + mem.html + '</datalist></div>' +
            '<div class="field full"><label for="l_book">Book *</label>' +
              '<input class="input" id="l_book" name="book" list="bookList" placeholder="Type a title, then pick from the list" autocomplete="off" required>' +
              '<datalist id="bookList">' + bk.html + '</datalist>' +
              '<span class="hint">Lending a book that a student reserved? Use the Reservations page instead.</span></div>' +
            '<div class="field"><label for="l_durasi">Loan length (days)</label>' +
              '<input class="input" id="l_durasi" name="durasi" type="number" min="1" max="90" value="' + settings.durasi_pinjam_default + '" required>' +
              '<span class="hint">Up to ' + settings.maks_buku_per_siswa + ' books per student.</span></div>' +
          '</div>',
          onSubmit: async function (d) {
            var memberId = mem.map[d.member], bookId = bk.map[d.book];
            if (!memberId) throw new Error('Pick the student from the list that appears while typing.');
            if (!bookId) throw new Error('Pick the book from the list that appears while typing.');
            var res = await API.post('createLoan', { id_anggota: memberId, id_buku: bookId, durasi: d.durasi });
            UI.toast('Loan recorded, due ' + UI.fmtDate(res.tgl_jatuh_tempo), 'success');
          }
        });
        if (ok) { refs = null; load(); }
      }

      // ----- Return and extend -----
      async function doReturn(l) {
        var extra = l.days_late > 0
          ? '<br>' + l.days_late + (l.days_late === 1 ? ' day' : ' days') + ' late' + (l.fine > 0 ? ', fine ' + UI.rupiah(l.fine) : '') + '.'
          : '';
        var ok = await Admin.confirm({
          title: 'Receive this book back?', submit: 'Yes, it is back',
          text: '<strong>' + UI.esc(l.judul) + '</strong> from <strong>' + UI.esc(l.nama) + '</strong>.' + extra +
            '<br><span class="hint">If another student reserved it, the copy is held for them automatically.</span>',
          action: function () { return API.post('returnLoan', { id: l.id }); }
        });
        if (ok) { UI.toast('Book returned', 'success'); refs = null; load(); }
      }

      async function doExtend(l) {
        var newDue = '';
        var ok = await Admin.confirm({
          title: 'Extend this loan?', submit: 'Extend',
          text: '<strong>' + UI.esc(l.judul) + '</strong> borrowed by <strong>' + UI.esc(l.nama) + '</strong> will be extended by ' +
            settings.durasi_perpanjangan + ' days.' + (l.days_late > 0 ? ' Because it is already late, counting starts from today.' : ''),
          action: async function () { newDue = (await API.post('extendLoan', { id: l.id })).tgl_jatuh_tempo; }
        });
        if (ok) { UI.toast('New due date: ' + UI.fmtDate(newDue), 'success'); load(); }
      }

      async function copyLate() {
        var list = visible();
        if (!list.length) { UI.toast('There is nothing to copy', 'error'); return; }
        var text = 'Overdue library books:\n' + list.map(function (l, i) {
          return (i + 1) + '. ' + l.nama + (l.kelas ? ' (' + l.kelas + ')' : '') + ' - ' + l.judul + ' - ' + l.days_late + (l.days_late === 1 ? ' day' : ' days') + ' overdue';
        }).join('\n');
        try { await navigator.clipboard.writeText(text); UI.toast('List copied to the clipboard', 'success'); }
        catch (e) { UI.toast('Your browser does not allow copying automatically', 'error'); }
      }

      // ----- Events -----
      $('seg').addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-f]');
        if (!b || b.getAttribute('data-f') === filter) return;
        filter = b.getAttribute('data-f'); page = 1;
        history.replaceState(null, '', filter === 'active' ? location.pathname : '?filter=' + filter);
        markSeg(); load();
      });
      $('q').addEventListener('input', UI.debounce(function () { q = $('q').value.trim(); page = 1; render(); }, 200));
      $('addBtn').onclick = openLoanForm;
      $('copyBtn').onclick = copyLate;
      $('prev').onclick = function () { page--; render(); };
      $('next').onclick = function () { page++; render(); };
      $('rows').addEventListener('click', function (ev) {
        var h = ev.target.closest('[data-hist]');
        if (h) {
          if (h.getAttribute('data-hist') === 'member') Admin.showMemberHistory(h.getAttribute('data-id'));
          else Admin.showBookHistory(h.getAttribute('data-id'));
          return;
        }
        var btn = ev.target.closest('[data-act]');
        if (!btn || btn.disabled) return;
        var l = loans.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (!l) return;
        if (btn.getAttribute('data-act') === 'ret') doReturn(l); else doExtend(l);
      });

      markSeg();
      API.post('getSettings').then(function (s) { settings = s; render(); }).catch(function () { /* keep defaults */ });
      load();
    })();
  </script>
</body>
</html>
