<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Details - School Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <a class="back" href="index.html">
        <iconify-icon icon="lucide:arrow-left" width="18" height="18" aria-hidden="true"></iconify-icon>
        Back to catalog
      </a>
      <div id="detail"></div>
      <section class="similar" id="similar" hidden>
        <h2>More in this category</h2>
        <div class="grid" id="similarGrid"></div>
      </section>
    </div>
    <div style="height:56px"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    (function () {
      UI.mountChrome('catalog');
      var root = document.getElementById('detail');
      var id = new URLSearchParams(location.search).get('id');
      var NIS_KEY = 'lib_last_nis';

      function skeleton() {
        return '<div class="detail"><div class="detail-cover"><div class="skeleton" style="aspect-ratio:3/4;border-radius:4px 12px 12px 4px"></div></div>' +
          '<div class="detail-main"><div class="skeleton" style="height:22px;width:90px"></div>' +
          '<div class="skeleton" style="height:40px;width:80%"></div><div class="skeleton" style="height:18px;width:40%"></div>' +
          '<div class="skeleton" style="height:96px"></div></div></div>';
      }

      function dots(b) {
        var total = Math.min(Number(b.stok_total) || 0, 24), on = Math.min(Number(b.stok_tersedia) || 0, total), out = '';
        for (var i = 0; i < total; i++) out += '<i class="' + (i < on ? 'on' : '') + '"></i>';
        return out;
      }

      function fact(label, value) {
        return value ? '<dt>' + label + '</dt><dd>' + UI.esc(value) + '</dd>' : '';
      }

      function reservePanel(b) {
        if (Number(b.stok_tersedia) > 0) return '';
        var q = Number(b.queue) || 0;
        var saved = '';
        try { saved = localStorage.getItem(NIS_KEY) || ''; } catch (e) { /* ignore */ }
        return '<div class="panel reserve" id="reservePanel">' +
          '<h2>All copies are on loan</h2>' +
          '<p>' + (q ? q + (q === 1 ? ' student is' : ' students are') + ' already waiting. ' : 'Nobody is waiting yet. ') +
          'Reserve this book and you will be in the queue. When a copy comes back, the library holds it for you for a few days.</p>' +
          '<form class="reserve-form" id="reserveForm">' +
            '<input class="input" id="rnis" inputmode="numeric" autocomplete="off" placeholder="Your Student ID (NIS)" value="' + UI.esc(saved) + '" required aria-label="Student ID">' +
            '<button class="btn btn-primary" id="reserveBtn" type="submit">Reserve this book</button>' +
          '</form><div id="reserveMsg" aria-live="polite"></div></div>';
      }

      function render(b) {
        document.title = b.judul + ' - ' + CONFIG.LIB_NAME;
        var stock = Number(b.stok_tersedia), total = Number(b.stok_total);
        root.innerHTML =
          '<div class="detail">' +
            '<div class="detail-cover">' + UI.cover(b, 'lg') + '</div>' +
            '<div class="detail-main">' +
              '<div>' +
                (b.kategori ? '<span class="badge">' + UI.esc(b.kategori) + '</span>' : '') +
                '<h1>' + UI.esc(b.judul) + '</h1>' +
                '<p class="author">' + (b.penulis ? 'by ' + UI.esc(b.penulis) : 'Unknown author') + '</p>' +
              '</div>' +
              '<div class="panel">' +
                '<div class="avail-head">' + UI.availBadge(b) +
                  '<span>' + (total ? stock + ' of ' + total + (total === 1 ? ' copy is' : ' copies are') + ' on the shelf' : 'No copies recorded yet') + '</span></div>' +
                '<div class="dots" aria-hidden="true">' + dots(b) + '</div>' +
              '</div>' +
              reservePanel(b) +
              '<dl class="facts">' +
                fact('Publisher', b.penerbit) + fact('Year', b.tahun) + fact('ISBN', b.isbn) + fact('Category', b.kategori) +
              '</dl>' +
              (b.deskripsi ? '<div><h2>About this book</h2><p class="desc">' + UI.esc(b.deskripsi) + '</p></div>' : '') +
              '<div class="panel how">' +
                '<h2>How to borrow</h2>' +
                '<ul>' +
                  '<li>' + UI.icon('book-open', 20) + '<span>Find the book on the shelf by category, or ask the librarian.</span></li>' +
                  '<li>' + UI.icon('id-card', 20) + '<span>Take it to the desk and give your Student ID (NIS).</span></li>' +
                  '<li>' + UI.icon('clock', 20) + '<span>Track your due date on the My loans page.</span></li>' +
                '</ul>' +
              '</div>' +
            '</div>' +
          '</div>';
        var form = document.getElementById('reserveForm');
        if (form) form.addEventListener('submit', function (ev) { ev.preventDefault(); reserve(b); });
      }

      async function reserve(b) {
        var nis = document.getElementById('rnis').value.trim();
        var btn = document.getElementById('reserveBtn'), msg = document.getElementById('reserveMsg');
        if (!nis) return;
        btn.disabled = true; btn.textContent = 'Reserving...';
        msg.innerHTML = '';
        try {
          var r = await API.post('reserveBook', { id_buku: b.id, nis: nis }, { auth: false });
          try { localStorage.setItem(NIS_KEY, nis); } catch (e) { /* ignore */ }
          document.getElementById('reserveForm').hidden = true;
          msg.innerHTML = '<div class="notice ok">' + UI.icon('circle-check', 22) + '<span>Reserved! You are number ' + r.position +
            ' in the queue. We will hold a copy for you when it is ready. Follow it on <a class="link" href="status.html?nis=' +
            encodeURIComponent(nis) + '">My loans</a>.</span></div>';
        } catch (e) {
          msg.innerHTML = '<div class="notice bad">' + UI.icon('triangle-alert', 22) + '<span>' + UI.esc(e.message) + '</span></div>';
          btn.disabled = false; btn.textContent = 'Reserve this book';
        }
      }

      function card(b) {
        return '<a class="book" href="book.html?id=' + encodeURIComponent(b.id) + '">' + UI.cover(b) +
          '<div class="book-info"><h3 class="book-title">' + UI.esc(b.judul) + '</h3>' +
          '<p class="book-author">' + UI.esc(b.penulis || '') + '</p>' + UI.availBadge(b) + '</div></a>';
      }

      async function loadSimilar(b) {
        if (!b.kategori) return;
        try {
          var data = await API.get('listBooks', { kategori: b.kategori, pageSize: 6 }, 120);
          var items = data.items.filter(function (x) { return x.id !== b.id; }).slice(0, 5);
          if (!items.length) return;
          document.getElementById('similarGrid').innerHTML = items.map(card).join('');
          document.getElementById('similar').hidden = false;
        } catch (e) { /* optional section, ignore */ }
      }

      async function init() {
        if (!id) {
          root.innerHTML = UI.state({
            icon: 'search-x', title: 'No book selected', text: 'Open a book from the catalog page.',
            action: '<a class="btn btn-soft" href="index.html">Go to catalog</a>'
          });
          return;
        }
        root.innerHTML = skeleton();
        try {
          var b = await API.get('getBook', { id: id });
          render(b);
          loadSimilar(b);
        } catch (e) {
          root.innerHTML = UI.state({
            icon: 'search-x', title: 'This book could not be loaded', text: e.message,
            action: '<a class="btn btn-soft" href="index.html">Back to catalog</a>'
          });
        }
      }
      init();
    })();
  </script>
</body>
</html>
